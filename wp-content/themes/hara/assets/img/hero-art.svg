<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-label="Illustration: the sun drying fruit and vegetables on racks under a solar panel">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#F6B42C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD25A"/>
      <stop offset="1" stop-color="#F39A12"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E8E3A"/>
      <stop offset="1" stop-color="#1F6B2A"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B6CC4"/>
      <stop offset="1" stop-color="#173F7A"/>
    </linearGradient>
  </defs>

  <!-- sun -->
  <circle cx="420" cy="170" r="170" fill="url(#glow)" opacity=".7"/>
  <g transform="translate(420 170)" fill="#F39A12">
    <g id="ray"><path d="M-9 -150 L0 -112 L9 -150 Z"/></g>
    <use href="#ray" transform="rotate(22.5)"/><use href="#ray" transform="rotate(45)"/><use href="#ray" transform="rotate(67.5)"/>
    <use href="#ray" transform="rotate(90)"/><use href="#ray" transform="rotate(112.5)"/><use href="#ray" transform="rotate(135)"/>
    <use href="#ray" transform="rotate(157.5)"/><use href="#ray" transform="rotate(180)"/><use href="#ray" transform="rotate(202.5)"/>
    <use href="#ray" transform="rotate(225)"/><use href="#ray" transform="rotate(247.5)"/><use href="#ray" transform="rotate(270)"/>
    <use href="#ray" transform="rotate(292.5)"/><use href="#ray" transform="rotate(315)"/><use href="#ray" transform="rotate(337.5)"/>
  </g>
  <circle cx="420" cy="170" r="96" fill="url(#sun)"/>
  <circle cx="452" cy="140" r="26" fill="#FFF6D6" opacity=".9"/>

  <!-- hills -->
  <path d="M0 360 C120 300 240 320 340 350 S560 330 640 300 V560 H0 Z" fill="#8CC152" opacity=".55"/>
  <path d="M0 400 C140 350 260 370 380 395 S560 380 640 360 V560 H0 Z" fill="url(#hill1)"/>

  <!-- solar panel -->
  <g transform="translate(70 228) skewX(-14)">
    <rect width="230" height="96" rx="6" fill="url(#panel)" stroke="#E8F0FB" stroke-width="4"/>
    <g stroke="#B9D2F2" stroke-width="2" opacity=".85">
      <path d="M46 0v96M92 0v96M138 0v96M184 0v96M0 32h230M0 64h230"/>
    </g>
  </g>
  <path d="M150 324v52M250 324v52" stroke="#4A4A4A" stroke-width="6" stroke-linecap="round"/>

  <!-- drying rack -->
  <g transform="translate(150 392)">
    <path d="M10 0 L20 120 M330 0 L320 120" stroke="#8A5A2B" stroke-width="10" stroke-linecap="round"/>
    <rect x="0" y="-8" width="340" height="16" rx="8" fill="#B07A3E"/>
    <rect x="0" y="52" width="340" height="16" rx="8" fill="#B07A3E"/>
    <!-- top tray: mango & pineapple -->
    <g transform="translate(26 -26)">
      <ellipse cx="0" cy="12" rx="22" ry="12" fill="#F39A12"/>
      <ellipse cx="52" cy="12" rx="22" ry="12" fill="#F6B42C"/>
      <ellipse cx="104" cy="12" rx="22" ry="12" fill="#F39A12"/>
      <circle cx="160" cy="10" r="15" fill="#F6D04D" stroke="#E7A912" stroke-width="5"/>
      <circle cx="204" cy="10" r="15" fill="#F6D04D" stroke="#E7A912" stroke-width="5"/>
      <ellipse cx="256" cy="12" rx="22" ry="12" fill="#F6B42C"/>
    </g>
    <!-- lower tray: tomato, pepper, okra, leaves -->
    <g transform="translate(24 36)">
      <circle cx="0" cy="10" r="13" fill="#D7352A"/>
      <circle cx="36" cy="10" r="13" fill="#E14B2E"/>
      <path d="M62 14 q22 -18 46 -4" stroke="#C62A1C" stroke-width="10" stroke-linecap="round" fill="none"/>
      <path d="M122 14 q22 -18 46 -4" stroke="#C62A1C" stroke-width="10" stroke-linecap="round" fill="none"/>
      <ellipse cx="198" cy="10" rx="20" ry="8" fill="#5E9B2E"/>
      <ellipse cx="240" cy="10" rx="20" ry="8" fill="#4C8A24"/>
      <ellipse cx="280" cy="10" rx="16" ry="8" fill="#6FAE3A"/>
    </g>
  </g>

  <!-- leaves -->
  <path d="M30 470 C60 400 120 380 150 400 C120 420 80 450 30 470 Z" fill="#2E7D32"/>
  <path d="M600 480 C580 410 520 390 490 405 C520 425 560 455 600 480 Z" fill="#2E7D32"/>
</svg>
